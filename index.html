<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino's Gym Solihull | DON'T BE HALF A MAN!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
      :root {
        --paper: #e6d5b8; /* Muted vintage yellow-tan */
        --retro-blue: #1b3a4b; /* Deep navy blue from the ad */
        --retro-black: #121212;
        --retro-red: #d32f2f;
      }
      body {
        background-color: var(--paper);
        color: var(--retro-black);
        font-family: 'Courier Prime', monospace;
        background-image: 
          url('https://www.transparenttextures.com/patterns/halftone.png'),
          radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
        background-size: auto, 12px 12px;
        background-attachment: fixed;
      }
      .font-heading {
        font-family: 'Anton', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .font-comic-bold {
        font-family: 'Anton', sans-serif;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      .font-handwriting {
        font-family: 'Permanent Marker', cursive;
      }
      .font-typewriter {
        font-family: 'Special Elite', cursive;
      }
      .font-comic {
        font-family: 'Bangers', cursive;
      }
      .paper-texture {
        position: fixed;
        inset: 0;
        background-image: url('https://www.transparenttextures.com/patterns/old-paper.png');
        pointer-events: none;
        z-index: 9999;
        opacity: 0.25;
      }
      .retro-border {
        border: 4px solid var(--retro-black);
      }
      
      /* Animation Reveal System */
      .reveal {
        opacity: 0;
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: var(--delay, 0ms);
      }
      
      .reveal-up { transform: translateY(40px); }
      .reveal-down { transform: translateY(-40px); }
      .reveal-left { transform: translateX(40px); }
      .reveal-right { transform: translateX(-40px); }
      .reveal-scale { transform: scale(0.95); }
      .reveal-fade { transform: none; }

      .reveal.visible {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      
      .gold-glow:hover {
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      }
      
      .vintage-img {
        filter: grayscale(1) contrast(1.2);
        mix-blend-mode: multiply;
      }

      /* Lightbox specific animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes zoomInUp {
        from { transform: scale(0.9) rotate(0deg) translateY(20px); opacity: 0; }
        to { transform: scale(1) rotate(1deg) translateY(0); opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      .animate-zoom-in-up {
        animation: zoomInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--paper);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--retro-black);
        border: 2px solid var(--paper);
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.475.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
  </head>
  <body>
    <div class="paper-texture"></div>
    <div id="root"></div>
  </body>
</html>
