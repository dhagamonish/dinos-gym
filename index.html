
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino's Gym Solihull | Hardcore Bodybuilding & Powerlifting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #080808;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      .font-heading {
        font-family: 'Bebas Neue', sans-serif;
        letter-spacing: -0.02em;
      }
      .gritty-overlay {
        background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
      }
      .gold-glow {
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
      }
      .text-outline {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
        color: transparent;
      }
      /* Custom Cursor / Selection */
      ::selection {
        background: #FFD700;
        color: #000;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #080808;
      }
      ::-webkit-scrollbar-thumb {
        background: #FFD700;
      }
      
      /* Refined Reveal Animations */
      .reveal {
        opacity: 0;
        transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        transition-delay: var(--delay, 0ms);
        will-change: transform, opacity;
      }
      
      .reveal-up { transform: translateY(50px); }
      .reveal-down { transform: translateY(-50px); }
      .reveal-left { transform: translateX(50px); }
      .reveal-right { transform: translateX(-50px); }
      .reveal-scale { transform: scale(0.95); }
      .reveal-fade { transform: none; }

      .reveal.visible {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }

      /* Hero Specific Intro */
      @keyframes heroIntro {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .hero-animate {
        animation: heroIntro 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
    </style>
