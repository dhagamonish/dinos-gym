<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino's Gym Solihull | FORGE YOUR LEGACY!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Courier+Prime:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
      :root {
        --paper: #f0e6d2; 
        --retro-blue: #1b3a4b; 
        --retro-black: #121212;
        --retro-red: #d32f2f;
      }
      body {
        background-color: var(--paper);
        color: var(--retro-black);
        font-family: 'Courier Prime', monospace;
        background-image: url('https://images.unsplash.com/photo-1586075010633-de44f547c8c1?q=80&w=2500');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        overflow-x: hidden;
      }
      .font-heading {
        font-family: 'Anton', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .font-comic-bold {
        font-family: 'Anton', sans-serif;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      .font-handwriting {
        font-family: 'Permanent Marker', cursive;
      }
      .font-typewriter {
        font-family: 'Special Elite', cursive;
      }
      .font-comic {
        font-family: 'Bangers', cursive;
      }
      
      .vintage-paper-texture {
        background-color: var(--paper);
        background-image: url('https://images.unsplash.com/photo-1586075010633-de44f547c8c1?q=80&w=1200');
        background-size: cover;
        background-position: center;
        background-blend-mode: multiply;
      }

      .paper-texture-overlay {
        position: fixed;
        inset: 0;
        background-image: url('https://www.transparenttextures.com/patterns/old-paper.png');
        pointer-events: none;
        z-index: 9999;
        opacity: 0.15;
      }

      .retro-border {
        border: 4px solid var(--retro-black);
      }
      
      .reveal {
        opacity: 0;
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: var(--delay, 0ms);
      }
      
      .reveal-up { transform: translateY(40px); }
      .reveal-down { transform: translateY(-40px); }
      .reveal-left { transform: translateX(40px); }
      .reveal-right { transform: translateX(-40px); }
      .reveal-scale { transform: scale(0.95); }
      .reveal-fade { transform: none; }

      .reveal.visible {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      
      @keyframes loadingBar {
        0% { transform: scaleX(0); }
        50% { transform: scaleX(1); }
        100% { transform: scaleX(0); }
      }
      .animate-loading-bar {
        animation: loadingBar 1.5s infinite ease-in-out;
        transform-origin: left;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes zoomInUpSimple {
        from { transform: scale(0.9) translateY(20px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      .animate-zoom-in-up {
        animation: zoomInUpSimple 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--paper);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--retro-black);
        border: 2px solid var(--paper);
      }
    </style>
